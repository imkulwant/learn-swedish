    reviewedBy: Anna
    reviewedAt: '2026-11-19'
    pos: noun
    forms: [en affär, affären, affärer, affärerna]
    en: shop, store
    example: { sv: 'Affären på hörnet har öppet till klockan 22.', en: 'The shop on the corner is open until 10 pm.' }
  - id: pris
    status: reviewed
    reviewedBy: Anna
    reviewedAt: '2026-11-19'
    pos: noun
    forms: [ett pris, priset, priser, priserna]
