    title: Ekdala bibliotek i november
    blocks:
      - heading: Öppettider
        lines:
          - Måndag–torsdag 10–20. Fredag 10–17. Lördag 11–15. Söndag stängt.
      - heading: Språkcafé
        lines:
          - Varje tisdag klockan 17–19 kan du träffa andra och prata svenska över en kopp kaffe. Ingen anmälan behövs. Kaffet är gratis.
      - heading: Läxhjälp
        lines:
          - Elever i årskurs 4–9 kan få hjälp med läxorna på onsdagar klockan 15–17. Anmäl dig i informationsdisken senast dagen innan.
      - heading: Låna dator
        lines:
          - Du kan låna en dator i en timme i taget. Du behöver ett lånekort. Ta med legitimation när du skaffar lånekort.
    items:
      - type: mc
        id: m1-bibliotek-1
        prompt: När kan man prata svenska på biblioteket?
        options:
          - På tisdagar klockan 17–19
          - På onsdagar klockan 15–17
          - På lördagar klockan 11–15
        answer: 0
        explain: The language café, "Språkcafé", is every Tuesday 17–19.
      - type: mc
        id: m1-bibliotek-2
        prompt: Vad måste man göra för att få läxhjälp?
        options:
          - Betala i informationsdisken
          - Anmäla sig senast dagen innan
