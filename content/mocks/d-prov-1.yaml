  - id: m1-hemifran
    status: reviewed
    reviewedBy: Anna
    reviewedAt: '2026-11-18'
    kp27: [lyssna-lasa.skonlitteratur-sakprosa]
    theme: arbete
    instruction: Läs inläggen. Vem tycker vad? Para ihop påståendena med rätt person.
    title: Forum – Jobba hemifrån?
    blocks:
      - author: Leila
        lines:
          - Jag jobbar hemma två dagar i veckan. Jag slipper resa en timme, och jag hinner hämta barnen tidigare. För mig är det perfekt.
      - author: Tomas
        lines:
          - Hemma blir jag ensam. Jag saknar kollegorna och fikat. Därför åker jag till kontoret varje dag, fast det tar tid.
      - author: Maja
        lines:
          - Det beror på uppgiften. När jag ska skriva behöver jag lugn och ro hemma, men möten fungerar bättre på jobbet.
      - author: Erik
        lines:
          - Jag är busschaufför, så jag kan inte jobba hemifrån. Men jag tycker att alla som kan borde få göra det.
    items:
      - type: match
        id: m1-hemifran-1
        prompt: Vem tycker vad?
        pairs:
          - q: Det är bäst att välja plats efter vad man ska göra.
            answer: 2
          - q: Att jobba hemma gör det lättare att få ihop livet med barn.
            answer: 0
          - q: Det sociala på jobbet är viktigast.
            answer: 1
          - q: Fler borde få chansen att jobba hemma.
            answer: 3
        options: [Leila, Tomas, Maja, Erik]
        explain: Leila can pick up the children earlier, Tomas misses colleagues and fika, Maja chooses by task, and Erik thinks everyone who can should be allowed to.

  - id: m1-cykel
    status: reviewed
    reviewedBy: Anna
    reviewedAt: '2026-11-18'
    kp27: [lyssna-lasa.skonlitteratur-sakprosa, lyssna-lasa.strategier]
    theme: trafik och miljö
    instruction: Läs artikeln och svara på frågorna.
    title: Fler cyklar till jobbet i Ekdala
    blocks:
      - lines:
          - Antalet personer som cyklar till jobbet i Ekdala har ökat med nästan en tredjedel på två år. Det visar en ny undersökning från kommunen.
          - En viktig orsak är den nya cykelbanan mellan centrum och industriområdet i norr, som öppnade förra våren. Tidigare fick cyklisterna dela väg med bilar och lastbilar.
          - – Förut tog jag bilen varje dag eftersom jag tyckte att det var för farligt att cykla, säger Samir Aziz, som jobbar på ett lager i industriområdet. Nu cyklar jag från april till oktober, och jag mår mycket bättre.
          - Kommunen har också satt upp nya cykelställ vid busstationen, så att fler kan cykla en bit och ta bussen resten av vägen.
          - Alla är dock inte nöjda. Flera bilister tycker att det har blivit svårare att parkera i centrum, eftersom en del parkeringsplatser har tagits bort för att ge plats åt cykelbanan.
          - Kommunen planerar nu en ny cykelbana till sjukhuset. Den ska vara klar om tre år.
    items:
      - type: mc
        id: m1-cykel-1
        prompt: Varför cyklar fler till jobbet nu, enligt artikeln?
        options:
          - Bensinen har blivit dyrare.
          - Det finns en ny cykelbana.
          - Bussarna går mer sällan.
        answer: 1
        explain: '"En viktig orsak är den nya cykelbanan".'
      - type: mc
        id: m1-cykel-2
        prompt: Vad kan man förstå om Samir Aziz?
        options:
          - Han cyklar hela året.
          - Han slutade köra bil helt förra våren.
          - Han kör troligen bil på vintern.
        answer: 2
        explain: 'He cycles "från april till oktober", so he probably uses the car in winter. The text does not say so: you have to read between the lines.'
      - type: short
        id: m1-cykel-3
        prompt: Varför är en del bilister missnöjda?
        accept:
          - det är svårare att parkera
          - det har blivit svårare att parkera i centrum
          - svårare att parkera
          - det finns färre parkeringsplatser
          - parkeringsplatser har tagits bort
        model: Det har blivit svårare att parkera i centrum, eftersom parkeringsplatser har tagits bort.
        explain: The article says some parking spaces were removed to make room for the cycle path.
      - type: mc
        id: m1-cykel-4
        prompt: Vad vill artikeln främst berätta?
        options:
          - Att cykling har ökat och vad det beror på
          - Att kommunen har för lite pengar
          - Att Samir Aziz har bytt jobb
        answer: 0
        explain: The article is about the increase in cycling and its causes, with one view against it.

