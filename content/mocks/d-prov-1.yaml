skriva:
  - id: m1-skriv-kalas
    status: reviewed
    reviewedBy: Anna
    reviewedAt: '2026-11-18'
    kp27:
      [
        samtala.berattelser-presentationer,
        samtala.anpassning,
        sprak.textstruktur,
      ]
    theme: familj och vänner
    register: informal
    title: Mejl till en vän
    en: An informal email declining an invitation
    task:
      - Din vän Sofia har bjudit dig på middag på lördag, men du kan inte komma. Skriv ett mejl till henne.
    points:
      - Tacka för inbjudan.
      - Förklara varför du inte kan komma.
      - Föreslå en annan dag och något ni kan göra.
    model:
      lines:
        - Hej Sofia!
        - Tack så mycket för inbjudan till middagen på lördag. Det låter jättetrevligt, men tyvärr kan jag inte komma. Min mamma kommer på besök från Irak samma helg, och jag har inte träffat henne på två år.
        - Kan vi ses en annan dag i stället? Nästa söndag är jag ledig. Om du vill kan vi gå en promenad runt sjön och sedan fika på kaféet i hamnen. Jag bjuder!
        - Hör av dig när du vet om det passar.
        - Kram
        - Nadia
      notes:
        - quote: Tack så mycket för inbjudan
          note: Thanks for the invitation first, as the task asks.
        - quote: men tyvärr kan jag inte komma
          note: Men and tyvärr say no in a polite way.
        - quote: Min mamma kommer på besök från Irak samma helg
          note: A concrete reason makes the answer friendly.
        - quote: Om du vill kan vi gå en promenad
          note: After the om clause, the verb kan comes first.
        - quote: Kram
          note: A warm closing that fits a friend.
  - id: m1-skriv-gatlampa
    status: reviewed
    reviewedBy: Anna
    reviewedAt: '2026-11-18'
    kp27: [samtala.anpassning, samtala.onskemal-asikter, sprak.textstruktur]
    theme: samhälle
    register: formal
    title: Mejl till kommunen
    en: A formal email to the municipality about a broken street light
    task:
      - Gatlampan vid gångvägen mellan din gata och skolan har varit trasig i flera veckor. Det är mörkt när barnen går till skolan. Skriv ett mejl till Ekdala kommun.
    points:
      - Beskriv var problemet finns och hur länge det har funnits.
      - Förklara varför det är ett problem.
      - Skriv vad du vill att kommunen ska göra.
    model:
      lines:
        - Hej,
        - Jag vill anmäla en trasig gatlampa på gångvägen mellan Björkgatan och Ekdalaskolan. Lampan har inte fungerat sedan början av oktober, alltså i över fyra veckor.
        - Det är ett problem eftersom många barn går den vägen till skolan. På morgonen är det nu helt mörkt, och flera föräldrar är oroliga för att något ska hända.
        - Jag skulle vilja att kommunen lagar lampan så snart som möjligt. Jag vill också gärna få veta när den kommer att lagas.
        - Med vänliga hälsningar
        - Karim Osman
        - Björkgatan 7
      notes:
        - quote: Jag vill anmäla en trasig gatlampa
          note: States the purpose in the first sentence.
        - quote: sedan början av oktober, alltså i över fyra veckor
          note: Says how long, as the task asks. Alltså makes it clearer.
        - quote: Det är ett problem eftersom många barn går den vägen
          note: Eftersom gives the reason.
        - quote: Jag skulle vilja att kommunen lagar lampan
          note: A polite, formal way to ask.
        - quote: Med vänliga hälsningar
          note: The usual formal closing, with full name and address.

tala:
  tasks:
    - id: m1-tala-fritid
      status: reviewed
      reviewedBy: Anna
      reviewedAt: '2026-11-18'
      kp27:
        [
          samtala.berattelser-presentationer,
          samtala.onskemal-asikter,
          samtala.anpassning,
          sprak.uttal,
        ]
      theme: fritid
      title: Fritid i Sverige
      en: Free time in Sweden – tell and give advice
      task:
        - En ny granne har just flyttat till Sverige och undrar vad man kan göra på fritiden.
      points:
        - Berätta vad du själv gör på fritiden.
        - Berätta om en aktivitet som har betytt mycket för dig.
        - Ge råd till grannen.
      phrases:
        - På fritiden brukar jag …
        - Det bästa med det är …
        - Jag tycker att du ska …
        - Om jag var du skulle jag …
      model:
        - voice: alma
          text: Jag ska berätta om vad jag gör på fritiden. På vardagarna har jag inte så mycket tid, men på helgerna brukar jag spela fotboll i en förening. Vi tränar varje lördag förmiddag. Ibland går jag också på bio med min familj.
        - voice: alma
          text: Fotbollen har betytt mycket för mig. När jag kom till Sverige kände jag ingen. I laget träffade jag nya vänner, och vi pratade svenska hela tiden. Därför lärde jag mig språket snabbare.
        - voice: alma
          text: Nu vill jag ge dig några råd. Mitt första råd är att gå med i en förening. Det finns föreningar för nästan allt, till exempel sport, musik och matlagning. Du kan fråga på biblioteket eller titta på kommunens webbplats.
        - voice: alma
          text: Mitt andra råd är att gå ut i naturen. I Sverige har alla rätt att vara i skogen, och det kostar ingenting. Om jag var du skulle jag också gå på språkcafé. Där kan man träffa både svenskar och andra som lär sig svenska. Lycka till!
  pairs:
    - id: m1-par-boende
      status: reviewed
      reviewedBy: Anna
      reviewedAt: '2026-11-18'
      kp27: [samtala.samtal-diskussioner, samtala.onskemal-asikter, sprak.uttal]
      theme: boende
      title: Att bo bra
      en: What matters most for a good home?
      question: Vad är viktigast för att trivas där man bor?
      mindmap:
        - hyran
        - grannarna
        - närhet till jobb eller skola
        - natur och parker
        - kommunikationer
        - lägenhetens storlek
      goal: Kom överens om vilka två saker som är viktigast.
      partner:
        - voice: nst
          text: Ska vi börja? Jag tycker att hyran är viktigast. Om hyran är för hög, har man inga pengar kvar till annat. Vad tycker du?
        - voice: nst
          text: Det förstår jag. Hur viktiga är grannarna för dig?
        - voice: nst
          text: För mig betyder naturen mycket. Jag vill kunna gå en promenad i skogen efter jobbet. Håller du med?
        - voice: nst
          text: Vilken sak i tankekartan tycker du är minst viktig?
        - voice: nst
          text: Okej. Nu måste vi komma överens. Vilka två saker väljer vi?
      closing:
        voice: nst
        text: Bra, då är vi överens. Tack för samtalet!
  phraseCards:
    - title: Ask for an opinion
      phrases: [Vad tycker du?, Håller du med?]
    - title: Give your opinion
      phrases: [Jag tycker att …, Jag tror att … eftersom …]
    - title: Agree or disagree
      phrases: [Jag håller med., Jag förstår vad du menar, men …]
    - title: Agree on a choice
      phrases: [Ska vi välja … och …?, Då är vi överens.]
